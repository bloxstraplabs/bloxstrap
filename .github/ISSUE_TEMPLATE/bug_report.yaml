name: LumiStrap bug report
description: Report a problem with LumiStrap
body:
  - type: markdown
    attributes:
      value: |
        Include the LumiStrap version, what you expected to happen, and the steps that reproduce the problem.
        Remove private information from logs before sharing them.
  - type: input
    id: version
    attributes:
      label: LumiStrap version
      description: Find the version in the About page.
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: List the steps from start to finish, if you can reproduce it.
      placeholder: |
        1. Open LumiStrap
        2. Select ...
        3. See the problem
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste a relevant LumiStrap log here after removing private information.
      value: N/A
      render: text
