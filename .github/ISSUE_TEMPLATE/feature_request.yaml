name: LumiStrap feature request
title: "[Feature] "
description: Suggest an improvement for LumiStrap
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want to solve and how the feature would help.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Include examples or a sketch if they help explain the idea.
    validations:
      required: true
