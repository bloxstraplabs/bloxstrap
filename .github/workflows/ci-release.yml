name: CI (Release)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-Release-${{ github.sha }}
          path: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Bloxstrap.exe

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Bloxstrap.exe
          name: Bloxstrap ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Release on Push to Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Bloxstrap (Continuous Release)
          files: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Bloxstrap.exe
          prerelease: true
          make_latest: false
